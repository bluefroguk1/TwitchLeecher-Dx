name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJ: TwitchLeecher/TwitchLeecher/TwitchLeecher.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The Services project downloads ffmpeg.exe (SHA-256 checked) on the first Windows build; reuse it until the pinned version changes.
      - uses: actions/cache@v6.1.0
        if: runner.os == 'Windows'
        with:
          path: TwitchLeecher/Libraries/ffmpeg.exe
          key: ffmpeg-${{ hashFiles('TwitchLeecher/TwitchLeecher.Services/TwitchLeecher.Services.csproj') }}

      - run: dotnet restore ${{ env.PROJ }}

      - run: dotnet build ${{ env.PROJ }} -c Release --no-restore

      - run: dotnet publish ${{ env.PROJ }} -c Release -r ${{ matrix.rid }} --self-contained -o publish

      - name: Check ffmpeg.exe is in the publish output
        if: runner.os == 'Windows'
        run: if (-not (Test-Path publish/ffmpeg.exe)) { throw 'ffmpeg.exe missing from publish output' }

      # The command-line tool: publish it next to the app and check it starts and parses arguments.
      - name: Command-line tool
        if: hashFiles('TwitchLeecher/TwitchLeecher.Cli/TwitchLeecher.Cli.csproj') != ''
        shell: bash
        run: |
          dotnet publish TwitchLeecher/TwitchLeecher.Cli/TwitchLeecher.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish-cli
          tl=./publish-cli/tl; [ -f "$tl.exe" ] && tl="$tl.exe"
          "$tl" --help
          set +e; "$tl" download https://www.twitch.tv/videos/123 --bogus x; usage=$?; "$tl" search somechannel; signin=$?; set -e
          echo "wrong option -> $usage (want 2), no sign-in -> $signin (want 3)"
          [ "$usage" = 2 ] && [ "$signin" = 3 ]
          cp -r publish-cli/. publish/

      - name: Artifact name from branch
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "ARTIFACT=TwitchLeecher-${BRANCH//[^A-Za-z0-9._-]/-}-${{ matrix.rid }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: publish/
          if-no-files-found: error
          retention-days: 14
